version: '3.8'

services:
  backend:
    image: toyota-backend:v1
    container_name: toyota-backend

    ports:
      - "3003:3003"

    restart: unless-stopped

    networks:
      - toyota-network

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  frontend:
    image: toyota-frontend:v1
    container_name: toyota-frontend

    ports:
      - "3051:80"

    depends_on:
      - backend

    restart: unless-stopped

    networks:
      - toyota-network

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

networks:
  toyota-network:
    driver: bridge
