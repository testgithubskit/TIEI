server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Keep redirects relative so the browser preserves host port (e.g. :3051).
    # Without this, nginx rebuilds Location with container port 80 and drops :3051.
    absolute_redirect off;

    location = / {
        return 301 /tiei_dynamic_gd/;
    }

    location = /tiei_dynamic_gd {
        return 301 /tiei_dynamic_gd/;
    }

    location /tiei_dynamic_gd/ {
        try_files $uri $uri/ /tiei_dynamic_gd/index.html;
    }

    # Proxies browser calls like /api/v1/... to the backend service
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream http://backend:3003;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
